[project]
name = "swissgeol-boreholes-photo-processor"
version = "0.1.0"
description = "Python project that generates composite images from photos of borehole cores and cuttings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "imagecodecs>=2026.10.10",
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "pillow==13.0.0",
    "PyYAML==6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "tifffile>=2026.3.3",
    "tqdm==4.70.1",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "moto==5.2.5",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit==4.7.0",
]

# ---- Configuration for package building
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
boreholes-photo-processor = "src.run:main_cores"
boreholes-photo-processor-cuttings = "src.run:main_cuttings"

# ---- Configuration for Ruff
[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    "D102",  # Missing docstring in a public method
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in `__init__`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103"]  # Test modules and functions don't need module/function docstrings

[tool.ruff]
line-length = 119

[tool.ruff.lint.pydocstyle]
convention = "google"
