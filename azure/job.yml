$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: borehole-photo-processor-test
experiment_name: borehole-photo-processor

code: ..

command: >-
  uv sync --frozen --no-dev &&
  uv run boreholes-photo-processor
  --input ${{inputs.borehole_data}}
  --output ${{outputs.results}}

inputs:
  borehole_data:
    type: uri_folder
    path: azureml:borehole-test@latest

outputs:
  results:
    type: uri_folder
    mode: upload

environment:
  build:
    path: ..
    dockerfile_path: Dockerfile

compute: azureml:swisstopo-dev
