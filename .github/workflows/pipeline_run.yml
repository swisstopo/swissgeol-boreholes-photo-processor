name: pipeline_run

on:
  pull_request:

jobs:
  pipeline_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies and run pipeline
        shell: bash
        run: |
          uv sync
          mkdir -p /tmp/borehole-input /tmp/borehole-output
          uv run run-pipeline --input /tmp/borehole-input --output /tmp/borehole-output
