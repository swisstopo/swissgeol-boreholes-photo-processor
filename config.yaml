# Configuration for the borehole photo processing pipeline.
# All keys are optional; omitted keys fall back to the defaults in src/config.py.

segmentation:
  n_workers: 4 # number of worker processes used to segment images in parallel

  core:
    tray_group:
      downscale_factor: 0.125 # scale images by this factor before segmenting (< 1.0 speeds up morphology)
      foreground_blur_sigma: 5.0 # gaussian blur applied to each image for foreground detection
      max_flow_shift: 100 # max optical flow displacement to allow, in pixels
      n_min_foreground: 10 # minimum number images required to estimate a foreground
      seed: 0 # seed for randomly sampling images from a group

    tray_single:
      block_size: 4000 # pixel neighborhood used to calculate the threshold
      closing_disk: 50 # radius for binary_closing (fills gaps)
      downscale_factor: 0.125 # scale images by this factor before segmenting (< 1.0 speeds up morphology)
      edge_margin_bottom: 5 # ignore bottom edge of image (ruler)
      edge_margin_top: 100 # ignore top edge of image (ruler)
      min_bbox_height: 500 # minimum height for a candidate core bounding box
      min_size_for_bottom: 500000 # minimum area for a candidate core to touch the bottom edge of the image
      min_object_size: 100000 # minimum blob size in pixels
      opening_disk: 20 # radius for binary_opening (removes noise)

    ruler:
      downscale_factor: 0.5 # scale images by this factor before OCR
      text_min_value: 1 # minimal visible number on ruler
      text_max_value: 99 # maximal visible number on ruler
      r_error_outliers: 0.1 # allow 10% error for outliers detection
      n_min_ruler: 10 # images to OCR per shape group before taking the median-scale detection
      seed: 0 # seed for randomly sampling images from a group

    core:
      downscale_factor: 0.125 # scale images by this factor before segmenting (< 1.0 speeds up morphology)
      background_val_hratio: 0.90 # fraction of dark-background pixels in a row required to trim that row
      background_val_vratio: 0.70 # fraction of dark-background pixels in a column required to trim that column
      background_val_threshold: 0.15 # value (HSV) below this = black background (not rock)
      wood_sat_hratio: 0.75 # fraction of tray-saturated pixels in a row required to classify that row as tray
      wood_sat_threshold: 0.28 # saturation above this = wooden tray (not rock)
      min_segment_height_px: 100 # minimum height (px) for a left/right segment to be kept as core

stitching:
  web_output_quality: 95 # output JPG quality/compression tradeoff, in the range 0–100
  web_downscale_factor: 0.25 # downscale factor applied to web image output
  core:
    font_size: 100 # font size (px) used for borehole ID, depth labels, and ruler tick labels
    max_core_height: 10000 # cap on each core crop's resized height (pixels) and the canvas row height
    max_core_width: 1200 # cap on each core crop's resized width (pixels) and the per-core column width
    num_cores_per_image: 6 # cores placed side by side per output sheet
    padding_horizontal: 150 # left/right border width in pixels
    padding_vertical: 200 # top/bottom border height in pixels
    ruler_width: 300 # width in pixels of each of the two depth rulers (left/right of the cores)
  cuttings:
    annotation_gap: 20 # gap in pixels between a cutting's image and its depth label
    annotation_width: 130 # width in pixels reserved at the right of each cell for the depth label
    font_size: 40 # font size (px) used for the depth label next to each cutting
    output_height: 2896 # total output canvas height (pixels), split evenly across the rows
    output_width: 2048 # total output canvas width (pixels), split evenly across the columns
    num_cuttings_columns: 3 # cuttings placed side by side per output sheet
    num_cuttings_rows: 15 # cuttings stacked per column per output sheet
    padding_cuttings: 20 # gap in pixels between neighboring cells, carved out of the output dimensions
    padding_horizontal: 170 # left/right border width in pixels
    padding_vertical: 150 # top/bottom border height in pixels

evaluation:
  core_width:
    min_samples: 5 # below this, skip the check (median/ratio unreliable with too few points)
    relative_tolerance: 0.25 # flag if relative tolerance exceeds this
  core_length:
    min_samples: 5 # below this, skip the check (median/ratio unreliable with too few points)
    relative_tolerance: 0.05 # flag if relative tolerance exceeds this
    max_depth_range: 1.00 # Cap height scale to 1 meter (no image with more than 1m core)
